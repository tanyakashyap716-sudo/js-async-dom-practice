<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asynchronous JavaScript & DOM Practice</title>
    <style>
        body {
            display: flex;
            gap: 40px;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .main {
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-self: center;
        }

        .box {
            height: 220px;
            width: 400px;
            border: 2px solid black;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            background-color: white;
            text-align: center;
        }

        .box3 {
            height: 460px;
            width: 400px;
            border: 2px solid black;
            border-radius: 10px;
            background-color: white;
            transition: background-color 0.5s ease; 
        }

        .btn {
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #f0f0f0;
        }

        .btn:disabled {
            background-color: #ddd;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box">
            <h1>1. SetInterval</h1>
            <p>This runs over and over.</p>
            <div style="font-weight: bold; font-size: 20px;">Count: <span class="count">0</span></div>
            <p style="font-style: italic; color: gray;">(Update every 1 second)</p>
        </div>
        <div class="box box2">
            <h1>2. SetTimeout</h1>
            <p>This happens exactly once after a delay.</p>
            <button class="btn">click me & wait 3 seconds</button>
        </div>
    </div>
    <div class="box3"></div>

    <script>
        function generate() {
            const r = Math.floor(Math.random() * 256);
            const g = Math.floor(Math.random() * 256);
            const b = Math.floor(Math.random() * 256);
            return `rgb(${r},${g},${b})`;
        }

        const randomBox = document.querySelector(".box3");
        setInterval(() => {
            randomBox.style.backgroundColor = generate();
        }, 1000);

        let count = 0;
        const numb = document.querySelector(".count");
        setInterval(() => {
            count++;
            numb.textContent = count;
        }, 1000);

        const box2 = document.querySelector(".box2");
        const btn = document.querySelector(".btn");

        btn.addEventListener("click", () => {
            btn.disabled = true; 

            let create = document.createElement("p");
            create.setAttribute("style", "font-weight: bold; color: blue;");
            create.innerHTML = `Wait...`;
            box2.appendChild(create);

            setTimeout(() => {
                create.innerHTML = `Hello! The 3 seconds are up!`;
                btn.disabled = false; 
            }, 3000);
        });
    </script>
</body>

</html>
